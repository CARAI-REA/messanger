syntax = "proto3";

package events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/CARAI-REA/messanger/shared/pkg/proto/events/v1;eventsv1";

message UserCreated {
  int64 user_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message UserDeleted {
  int64 user_id = 1;
  google.protobuf.Timestamp deleted_at = 2;
}

message ChatRealtimeEvent {
  string event_id = 1;
  int64 chat_id = 2;
  int64 actor_id = 3;
  google.protobuf.Timestamp at = 4;
  oneof payload {
    MessageCreated message_created = 10;
    MessageEdited message_edited = 11;
    MessageDeleted message_deleted = 12;
    MessagePinned message_pinned = 13;
    ReceiptRead receipt_read = 14;
    MemberChanged member_changed = 15;
  }
}

message MessageCreated {
  int64 message_id = 1;
  int64 sender_id = 2;
  string text = 3;
  repeated string attachment_ids = 4;
  google.protobuf.Timestamp send_at = 5;
}

message MessageEdited {
  int64 message_id = 1;
  string text = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message MessageDeleted {
  int64 message_id = 1;
}

message MessagePinned {
  int64 message_id = 1;
  bool is_pinned = 2;
}

message ReceiptRead {
  int64 user_id = 1;
  int64 message_id = 2;
}

message MemberChanged {
  int64 user_id = 1;
  string action = 2;
  int32 role = 3;
}
