syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/CARAI-REA/messanger/shared/pkg/proto/user/v1;userv1";

service UserService {
  rpc Create(CreateRequest) returns (CreateResponse) {
    option (google.api.http) = {
      post: "/api/v1/users"
      body: "*"
    };
  }
  rpc Get(GetRequest) returns (GetResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/{id}"
    };
  }
  rpc GetMe(google.protobuf.Empty) returns (GetResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/me"
    };
  }
  rpc GetByUsername(GetByUsernameRequest) returns (GetResponse) {
    option (google.api.http) = {
      get: "/api/v1/users/by-username/{username}"
    };
  }
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse) {
    option (google.api.http) = {
      get: "/api/v1/users:search"
    };
  }
  rpc Update(UpdateRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/api/v1/users/me"
      body: "*"
    };
  }
  rpc UpdatePassword(UpdatePasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/users/me/password"
      body: "*"
    };
  }
  rpc Delete(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/users/me"
    };
  }
  // Internal only — never expose over HTTP/Envoy public routes.
  rpc ValidateCredentials(ValidateCredentialsRequest) returns (ValidateCredentialsResponse);
}

message UserInfo {
  string name = 1;
  string email = 2;
  string username = 3;
}

message User {
  int64 id = 1;
  UserInfo user_info = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  string avatar_file_id = 5;
}

message CreateRequest {
  UserInfo user_info = 1;
  string password = 2;
  string password_confirm = 3;
}

message CreateResponse {
  int64 id = 1;
}

message GetRequest {
  int64 id = 1;
}

message GetByUsernameRequest {
  string username = 1;
}

message GetResponse {
  User user = 1;
}

message SearchUsersRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchUsersResponse {
  repeated User users = 1;
}

message UpdateRequest {
  google.protobuf.StringValue name = 1;
  google.protobuf.StringValue email = 2;
  google.protobuf.StringValue username = 3;
  google.protobuf.StringValue avatar_file_id = 4;
}

message UpdatePasswordRequest {
  string password = 1;
  string password_confirm = 2;
}

message ValidateCredentialsRequest {
  string email = 1;
  string password = 2;
}

message ValidateCredentialsResponse {
  bool valid = 1;
  int64 user_id = 2;
}
