syntax = "proto3";

package search.v1;

import "google/api/annotations.proto";

option go_package = "github.com/CARAI-REA/messanger/shared/pkg/proto/search/v1;searchv1";

service SearchService {
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse) {
    option (google.api.http) = { get: "/api/v1/search/messages" };
  }
  rpc SearchChats(SearchChatsRequest) returns (SearchChatsResponse) {
    option (google.api.http) = { get: "/api/v1/search/chats" };
  }
}

message SearchMessagesRequest {
  string query = 1;
  int64 chat_id = 2;
  string cursor = 3;
  int32 limit = 4;
}

message SearchMessageHit {
  int64 message_id = 1;
  int64 chat_id = 2;
  int64 sender_id = 3;
  string text = 4;
  double score = 5;
}

message SearchMessagesResponse {
  repeated SearchMessageHit hits = 1;
  string next_cursor = 2;
}

message SearchChatsRequest {
  string query = 1;
  string cursor = 2;
  int32 limit = 3;
}

message SearchChatHit {
  int64 chat_id = 1;
  string name = 2;
  string description = 3;
  double score = 4;
}

message SearchChatsResponse {
  repeated SearchChatHit hits = 1;
  string next_cursor = 2;
}
