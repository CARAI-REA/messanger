# Edge nginx on 192.168.0.169 (public 80/443) — not the app host.
# App host is 192.168.0.108; messanger web listens on 127.0.0.1:18088 and is
# reached via the app-host nginx vhost (Host: chat.arbuz-arbuz.site → :18088).

server {
    listen 80;
    server_name chat.arbuz-arbuz.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name chat.arbuz-arbuz.site;

    ssl_certificate     /etc/letsencrypt/live/chat.arbuz-arbuz.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.arbuz-arbuz.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    location / {
        proxy_pass http://192.168.0.108:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
