apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: messanger
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# Envoy may receive traffic from ingress controller / nginx edge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-envoy-ingress
  namespace: messanger
spec:
  podSelector:
    matchLabels:
      app: envoy
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# Gateway WS: from envoy and from nginx/ingress edge labeled app=nginx (optional).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ws
  namespace: messanger
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: envoy
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - protocol: TCP
          port: 8082
---
# Internal gRPC: user accepts auth + gateway (and optionally other services).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-user-grpc
  namespace: messanger
spec:
  podSelector:
    matchLabels:
      app: user
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth
        - podSelector:
            matchLabels:
              app: envoy
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 50051
---
