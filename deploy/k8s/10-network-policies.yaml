# Metrics scrape from prometheus only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-from-prometheus
  namespace: messanger
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9101
        - protocol: TCP
          port: 9102
        - protocol: TCP
          port: 9103
        - protocol: TCP
          port: 9104
        - protocol: TCP
          port: 9105
        - protocol: TCP
          port: 9106
        - protocol: TCP
          port: 9107
