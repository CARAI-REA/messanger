apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: messanger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: messanger/chat:latest
          ports:
            - containerPort: 50052
              name: grpc
            - containerPort: 9103
              name: metrics
          envFrom:
            - configMapRef:
                name: messanger-config
            - secretRef:
                name: messanger-secrets
          env:
            - name: GRPC_HOST
              value: "0.0.0.0"
            - name: GRPC_PORT
              value: "50052"
            - name: METRICS_HOST
              value: "127.0.0.1"
            - name: METRICS_PORT
              value: "9103"
            - name: REDIS_HOST
              value: redis
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: POSTGRES_HOST
              value: postgres-chat
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: chat
            - name: POSTGRES_USER
              value: chat_user
            - name: MIGRATION_DIRECTORY
              value: /app/internal/migrations
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: messanger
spec:
  selector:
    app: chat
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
