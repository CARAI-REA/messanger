apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: messanger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: messanger/user:latest
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9101
              name: metrics
          envFrom:
            - configMapRef:
                name: messanger-config
            - secretRef:
                name: messanger-secrets
          env:
            - name: GRPC_HOST
              value: "0.0.0.0"
            - name: GRPC_PORT
              value: "50051"
            - name: METRICS_HOST
              value: "127.0.0.1"
            - name: METRICS_PORT
              value: "9101"
            - name: REDIS_HOST
              value: redis
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: POSTGRES_HOST
              value: postgres-user
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: user
            - name: POSTGRES_USER
              value: user_user
            - name: MIGRATION_DIRECTORY
              value: /app/internal/migrations
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: messanger
spec:
  selector:
    app: user
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
