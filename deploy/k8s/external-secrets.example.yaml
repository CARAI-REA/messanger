# Example External Secrets Operator wiring for messanger.
# Replace clusterSecretStore / remote keys with your vault / AWS SM / GCP SM backend.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: messanger-secret-store
spec:
  provider:
    # Example: AWS Secrets Manager — swap for your provider.
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: messanger-secrets
  namespace: messanger
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: messanger-secret-store
  target:
    name: messanger-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: messanger/prod
        property: JWT_SECRET
    - secretKey: REFRESH_TOKEN_SECRET
      remoteRef:
        key: messanger/prod
        property: REFRESH_TOKEN_SECRET
    - secretKey: SERVICE_JWT_SECRET
      remoteRef:
        key: messanger/prod
        property: SERVICE_JWT_SECRET
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: messanger/prod
        property: REDIS_PASSWORD
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: messanger/prod
        property: POSTGRES_PASSWORD
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: messanger/prod
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: messanger/prod
        property: S3_SECRET_KEY
    - secretKey: FCM_CREDENTIALS_JSON
      remoteRef:
        key: messanger/prod
        property: FCM_CREDENTIALS_JSON
---
