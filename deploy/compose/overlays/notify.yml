services:
  postgres-notify:
    container_name: messanger-postgres-notify
    ports: !override
      - "127.0.0.1:${EXTERNAL_POSTGRES_PORT}:5432"

  notify:
    container_name: messanger-notify
    ports: !override
      - "127.0.0.1:${GRPC_PORT}:${GRPC_PORT}"
      - "127.0.0.1:${METRICS_PORT}:${METRICS_PORT}"
