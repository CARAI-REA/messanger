services:
  postgres-chat:
    container_name: messanger-postgres-chat
    ports: !override
      - "127.0.0.1:${EXTERNAL_POSTGRES_PORT}:5432"

  chat:
    container_name: messanger-chat
    ports: !override
      - "127.0.0.1:${GRPC_PORT}:${GRPC_PORT}"
      - "127.0.0.1:${METRICS_PORT}:${METRICS_PORT}"
