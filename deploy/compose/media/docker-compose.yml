services:
  postgres-media:
    image: postgres:17.0-alpine3.20
    container_name: postgres-media
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_media_data:/var/lib/postgresql/data
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - messanger-net

  media:
    build:
      context: ../../..
      dockerfile: deploy/docker/Dockerfile.media
    container_name: media
    env_file:
      - .env
    environment:
      GRPC_HOST: 0.0.0.0
      POSTGRES_HOST: postgres-media
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      MIGRATION_DIRECTORY: ./internal/migrations
    ports:
      - "${GRPC_PORT}:${GRPC_PORT}"
      - "${METRICS_PORT}:${METRICS_PORT}"
    depends_on:
      postgres-media:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - messanger-net

volumes:
  postgres_media_data:

networks:
  messanger-net:
    external: true
