global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: user
    static_configs: [{ targets: ["user:9101"] }]
  - job_name: auth
    static_configs: [{ targets: ["auth:9102"] }]
  - job_name: chat
    static_configs: [{ targets: ["chat:9103"] }]
  - job_name: gateway
    static_configs: [{ targets: ["gateway:9104"] }]
  - job_name: media
    static_configs: [{ targets: ["media:9105"] }]
  - job_name: search
    static_configs: [{ targets: ["search:9106"] }]
  - job_name: notify
    static_configs: [{ targets: ["notify:9107"] }]
