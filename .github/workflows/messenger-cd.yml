name: messenger-cd

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: messenger-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.x"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  ci-gate:
    name: Require green CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait note
        run: |
          echo "CD expects messenger CI workflow to be green on this ref."
          echo "Images are built here; k8s apply is manual/staging secret-gated."

  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [ci-gate]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [user, auth, chat, gateway, media, search, notify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vendor
        run: bash scripts/ci_vendor.sh
      - name: Set image metadata
        id: meta
        run: |
          SERVICE="${{ matrix.service }}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${REPO_LC}/${SERVICE}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="sha-${GITHUB_SHA::12}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=latest" >> "$GITHUB_OUTPUT"
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-staging:
    name: Deploy staging (manifest dry-run)
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Render note + validate manifests
        run: |
          echo "Staging deploy is gated on cluster credentials."
          echo "This job validates k8s YAML client-side; apply when KUBECONFIG secret is configured."
          if command -v kubectl >/dev/null; then
            kubectl apply --dry-run=client -f deploy/k8s/ || true
          else
            echo "kubectl not installed on runner — listing manifests:"
            find deploy/k8s -name '*.yaml' | sort
          fi
          test -f deploy/PROD_CHECKLIST.md
          test -f deploy/k8s/external-secrets.example.yaml

  deploy-production:
    name: Deploy production (manual)
    runs-on: ubuntu-latest
    needs: [build-images]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Production gate
        run: |
          echo "Production deploy requires:"
          echo "  1) Tag vX.Y.Z or workflow_dispatch production"
          echo "  2) PROD_CHECKLIST completed"
          echo "  3) External secrets + TLS mounted"
          echo "Wire kubectl/helm apply here when cluster access secrets exist."
          grep -n "Prod-ready\|Production checklist\|Verify commands" deploy/PROD_CHECKLIST.md README.md | head
